name: Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish win-x64
        run: dotnet publish bv.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./
        
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: auto-${{ github.run_number }}
          name: |
            Auto Release #${{ github.run_number }}
          files: bv.exe